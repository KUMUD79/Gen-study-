{% extends '_base.html' %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="min-h-full flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-xl shadow-2xl border border-gray-200 transition duration-300 hover:shadow-accent-green/50">
        <div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
                Create Your Study Profile
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600">
                Join the platform as a student or a teacher.
            </p>
        </div>
        <form class="mt-8 space-y-6" method="POST" action="{{ url_for('routes.register') }}">
            <div class="rounded-md shadow-sm space-y-3">
                <div>
                    <label for="username" class="sr-only">Username</label>
                    <input id="username" name="username" type="text" autocomplete="username" required 
                           class="appearance-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-primary-light focus:border-primary-light focus:z-10 sm:text-sm rounded-lg"
                           placeholder="Username">
                </div>
                <div>
                    <label for="password" class="sr-only">Password</label>
                    <input id="password" name="password" type="password" autocomplete="new-password" required 
                           class="appearance-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-primary-light focus:border-primary-light focus:z-10 sm:text-sm rounded-lg"
                           placeholder="Password">
                </div>
                <div>
                    <label for="role" class="block text-sm font-medium text-gray-700 mb-1">I am a...</label>
                    <select id="role" name="role" required
                            class="appearance-none relative block w-full px-3 py-3 border border-gray-300 text-gray-900 focus:outline-none focus:ring-primary-light focus:border-primary-light focus:z-10 sm:text-sm rounded-lg">
                        <option value="student" class="text-gray-900">Student / Learner</option>
                        <option value="teacher" class="text-gray-900">Teacher / Administrator</option>
                    </select>
                </div>
            </div>

            <div>
                <button type="submit" 
                        class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-accent-green hover:bg-emerald-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-accent-green transition duration-150 shadow-md hover:shadow-lg">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <i class="fas fa-user-plus h-5 w-5 text-emerald-300 group-hover:text-white transition duration-150"></i>
                    </span>
                    Register
                </button>
            </div>
            
            <div class="text-sm text-center mt-4">
                <a href="{{ url_for('routes.login') }}" class="font-medium text-primary-light hover:text-primary-dark transition duration-150">
                    Already have an account? Sign in.
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
